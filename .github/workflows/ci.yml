# CI — 시크릿(UNITY_EMAIL·UNITY_PASSWORD)이 없으면 dotnet 검사만 돌고 초록이어야 한다.
# 시크릿이 있으면: push 마다 EditMode/PlayMode 테스트. 굽기(WebGL·Android)는 **여기 없다** — T158 이 `build-webgl.yml`(schedule + 수동 · main push 트리거 없음)로 뗐다:
#   이 파일의 굽기 잡은 `unity-test` 잡 그룹의 «대기 중 런은 뒤 push 가 갈아치운다» 사슬에 `needs` 로 매여, 워커 push 가 이어지는 한 한 번도 끝까지 못 갔다(런 286·360 cancelled · 배포본 09-13 18:19 에 멈춤).
#
# T32 — concurrency 는 잡별로 나눈다. 워크플로 전체를 한 그룹에 넣으면 GitHub 이 «대기 중 런을 하나만» 두고 새 push 가 올 때마다
# 옛 대기 런을 취소해(런 9~16 전부 cancelled · 2026-09-12 실측) 워커 커밋이 dotnet 검사조차 못 받고 지나갔다.
#   · 빠른 잡(dotnet · datasync · gate): 그룹 없음 — push 마다 반드시 돈다(1분).
#   · unity-test: 잡 그룹 `unity-test-<ref>` 직렬(라이선스 활성화 겹침 방지 · 7분). 대기 중인 것은 뒤 push 가 갈아치울 수 있다 —
#     main 은 선형이라 뒤 런이 앞 커밋을 포함하므로 «내 뒤 런이 초록이면 내 확인» (ROUTINE §1).
#   · build-webgl · build-android: `build-webgl.yml` 로 옮겼다(T158) — 이 워크플로의 런이 취소돼도 굽기는 안 죽는다.
# (aaawunity 의 ci.yml 을 뼈대만 남기고 옮겼다 — 검사 자(tools/check_*.py)는 이 레포에서 필요해질 때 하나씩 더한다.)
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # screens 브랜치 배포(gh-pages 는 build-webgl.yml)
  checks: write     # unity-test-runner 가 «Test Results» 체크 런을 만들 때(githubToken 빈 값과 한 벌)

jobs:
  dotnet:
    name: dotnet 컴파일 · 순수 C# 테스트 · 문서·.meta 검사
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # check_claim_scope 가 «그 작업의 커밋이 실제로 만진 파일» 을 이력에서 읽는다. 얕은 클론이면 조용히 초록이 된다.
          fetch-depth: 300
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: dotnet build (UnityEngine 참조 어셈블리 · NuGet)
        run: dotnet build tools/dotnet/Forge.sln -c Release --nologo
      - name: dotnet test (EditMode 의 순수 C# 테스트)
        run: dotnet test tools/dotnet/Tests/Forge.Tests.csproj -c Release --no-build --nologo --logger "trx;LogFileName=results.trx"
      - name: .meta 누락/고아 검사
        run: python3 tools/gen_meta.py --check
      # T41 — 카탈로그 키 중복(«둘 다 살리기» rebase)은 파이썬과 유니티가 **다른 블록**을 읽어
      #       로컬·dotnet 전부 초록인 채 PlayMode 만 KeyNotFoundException 으로 빨갰다(런 32). 여기서 막는다.
      - name: UI 카탈로그 자 자기 검사
        run: python3 tools/gen_ui_catalog.py --self-test
      - name: "UI 카탈로그 ↔ UiCatalog.asset 동기화 · 키 중복 — 막는다"
        run: python3 tools/gen_ui_catalog.py --check
      # T182 — 표 하나가 깨지면 그것을 읽는 화면·연출·시험이 **통째로** 넘어진다(런 427: RibbonUi.json 13행 → PlayMode 20개).
      #        EditMode `ResourcesJsonTests`(T156 5회차)가 클론 파서로 같은 것을 보고, 이 자는 그보다 **먼저**(유니티 없이) 막고 `.meta` 짝까지 본다.
      - name: Resources 표 자 자기 검사 (T182 `check_resources_json.py` · 고장 주입 9칸)
        run: python3 tools/check_resources_json.py --self-test
      - name: Resources 표가 전부 읽히는가 + .meta 짝 — 막는다 (T182)
        run: python3 tools/check_resources_json.py
      # 문서가 «통째로 깨졌는가»(충돌 표식 · 결정 기록 소실 · 표 행 0개) — 되돌릴 자리가 묻히기 전에 **막는다**.
      - name: 문서 손상 자 자기 검사
        run: python3 tools/check_docs_intact.py --self-test
      - name: 문서가 통째로 깨졌는가 — 막는다
        run: python3 tools/check_docs_intact.py
      # T175 — 정본 `U.escapeHtml` 자리: 글자 공장 하나(`UiKit.Text`)가 TMP richText 를 끄고, 공장 밖에서 TMP 를 만들거나 되켜는 자리가 0인가
      #        (플레이어 닉네임·채팅의 꺾쇠가 태그로 먹히는 것을 막는다 · T33 13회차 · 결정 494). §3 에는 있었는데 CI 가 안 돌리던 자 — 여기서 막는다.
      - name: 리치텍스트 자 자기 검사 (T175 `check_richtext.py` · 고장 주입 7칸)
        run: python3 tools/check_richtext.py --self-test
      - name: TMP richText 가 글자 공장 밖에서 켜지는가 — 막는다 (T175)
        run: python3 tools/check_richtext.py
      # T414 — 런 851 실측: `SkillGridTopSiteTests` 가 `FindActive(app, "sk-orb")` 로 앱 뿌리부터 찾는데
      #        그 이름을 화면 셋이 쓴다. 남이 열어 둔 화면의 상자를 재고 난 빨강이라 «런 사이» 어느 커밋도
      #        그 화면을 안 건드려 **임자를 못 가린다**(워커 둘이 그대로 지나갔다). 겹치는 이름만 막는다.
      - name: 자 찾는 자리 자기 검사 (T414 `check_test_scope.py` · 12칸)
        run: python3 tools/check_test_scope.py --self-test
      - name: PlayMode 자가 앱 뿌리부터 «화면 둘이 쓰는 이름» 으로 찾는가 — 막는다 (T414)
        run: python3 tools/check_test_scope.py
      - name: 클릭 막이 자 자기 검사 (T33 24회차 `check_raycast.py` · 고장 주입 10칸)
        run: python3 tools/check_raycast.py --self-test
      - name: 공장 밖 Image 가 raycastTarget 을 정하는가 (T33 24회차 · 정본 pointer-events 68)
        run: python3 tools/check_raycast.py
      # 아래는 «조율 결함» — 배포된 게임이 못 쓰게 되는 종류가 아니라 **보고만** 한다(빨개도 안 막는다).
      # 자기 검사(순수 함수)는 막는다 — 자가 조용히 고장 나면 «누락 0건» 만 찍는다.
      # ⚑ T403 2회차 — «보고만» 을 **그대로 둔다**(결정 690). 1회차가 `gate.sh` 를 block 으로 올리며 «CI 도 막을지는
      #   한 회차 지켜본 뒤» 로 남긴 물음의 답이다. 까닭은 **잡 그래프**다: 이 스텝들은 `dotnet` 잡 안이고
      #   `unity-test` 가 `needs: [dotnet, gate]` 라, 여기를 막으면 표의 ⛔ 하나가 **유니티 잡을 통째로 건너뛰게** 만든다
      #   — §1 이 «빨간 테스트보다 나쁘다» 고 부르는 그 꼴이고(T67·T171·T180·T392) 모든 워커의 판정이 멎는다.
      #   선점 덫이 실제로 한 회차를 버리게 하는 자리는 **커밋 직전**이고 그건 `gate.sh` 가 이미 막는다(1회차 ⓐ).
      #   CI 의 몫은 «빌드·테스트가 사는가» 이지 장부 어긋남이 아니다. 되돌리려면 이 주석과 아래 두 줄의
      #   `continue-on-error: true` 를 지우면 되지만, 그 전에 이 스텝을 `gate` 잡으로 옮겨야 한다(그래야 유니티가 산다).
      - name: 작업 상태 자 자기 검사
        run: python3 tools/task_state.py --self-test
      - name: "작업 상태 대조 (ROUTINE §2 제목 ↔ PROGRESS 상태 · 번호 중복) — 보고만"
        continue-on-error: true
        run: python3 tools/task_state.py --check
      - name: 결정 번호 자 자기 검사
        run: python3 tools/check_decisions.py --self-test
      - name: "결정 번호 겹침 — 보고만"
        continue-on-error: true
        run: python3 tools/check_decisions.py
      - name: 표 행 자 자기 검사
        run: python3 tools/check_task_rows.py --self-test
      - name: "PROGRESS 표 행 어긋남 — 보고만"
        continue-on-error: true
        run: python3 tools/check_task_rows.py
      # T49 — §7 완결 대조표는 주인이 정한 «다 옮겨졌다» 의 기준이고 T33 이 그것으로 판정한다.
      - name: 완결 대조표 자 자기 검사
        run: python3 tools/check_final_table.py --self-test
      - name: "§7 완결 대조표 ↔ PROGRESS 상태 — 보고만"
        continue-on-error: true
        run: python3 tools/check_final_table.py
      - name: 범위 자 자기 검사
        run: python3 tools/check_claim_scope.py --selftest
      - name: "살아 있는 lock 이 «범위 열에 없는 파일» 을 쥐고 있는가 — 알리기만"
        continue-on-error: true
        run: python3 tools/check_claim_scope.py
      # T51 — 이 레포의 검사 자는 전부 «자기 검사» 가 여기 걸려 있다. T28 의 자만 빠져 있었다(T28 은 ci.yml 이 제 범위 밖이었다).
      - name: 원작 대조 자 자기 검사 (T28 `ui_score.py` · 15칸)
        run: python3 tools/ui_score.py --self-test

      - name: 글자 자 자기 검사 (T89 `check_text_glyphs.py`)
        run: python3 tools/check_text_glyphs.py --self-test

      - name: 화면 문구의 글자가 글꼴에 다 있는가 — 막는다 (T89 · 새 두부 □)
        run: python3 tools/check_text_glyphs.py

      - name: 셰이더·리소스 포함 자 자기 검사 (T126 `check_shaders_included.py` · 고장 주입 13칸)
        run: python3 tools/check_shaders_included.py --self-test

      - name: 이름으로 찾는 것(셰이더·Resources)이 빌드에도 실리는가 — 막는다 (T126 · 조용히 null 이 되는 자리)
        run: python3 tools/check_shaders_included.py

      # T184 ⓑ — §3 목록(tools/gate.sh 안 배열)과 이 파일이 갈리는 것을 **구조로** 막는다.
      #          자를 새로 세우고 여기 두 줄을 잊으면 이 스텝이 빨개진다 — 사람 기억에 안 맡긴다.
      #          (T175 가 check_richtext 하나를 세워 닫은 갈래가 하루 만에 둘로 다시 벌어져 있었다.)
      # T336 — screens 장부(runs.jsonl)를 겹친 런끼리 합치는 자. 유니티 잡의 배포 스텝이 밀기 전에도 돌리지만 그 잡은 Assets 를
      #        안 만진 push 에선 건너뛰므로 여기서도 돈다(자를 고친 커밋이 그 잡 없이 초록으로 지나가지 않게).
      - name: screens 장부 합치기 자 자기 검사 (T336 `screens_ledger.py --self-test` · 20칸)
        run: python3 tools/screens_ledger.py --self-test
      - name: screens 이어받기 자 자기 검사 (T347 `screens_carry.py --self-test` · 15칸)
        run: python3 tools/screens_carry.py --self-test
      - name: 게이트 자 자기 검사 (T184 `gate.sh --self-test` · 실물 컴파일 오류 주입 포함 27칸)
        run: tools/gate.sh --self-test
      - name: §3 게이트 목록 ↔ 이 파일이 부르는 이름 — 막는다 (T184 ⓑ)
        run: tools/gate.sh --check-ci
      - name: 테스트 결과 Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: tools/dotnet/Tests/TestResults/*.trx
          if-no-files-found: ignore

  # 정본(kuzuni/wwwww web/)과 이 레포의 data/*.json 이 같은가 — T2 가 tools/export_data.js·check_data_sync.sh 를 만들면 켠다.
  datasync:
    name: data/*.json ↔ wwwww main 동기화 검사
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: wwwww main 체크아웃 (정본)
        uses: actions/checkout@v4
        with:
          repository: kuzuni/wwwww
          ref: main
          path: .wwwww-src
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: data/*.json 동기화 검사 (스크립트가 아직 없으면 건너뛴다 · T2)
        run: |
          if [ -x tools/check_data_sync.sh ]; then tools/check_data_sync.sh .wwwww-src; else echo "::notice::tools/check_data_sync.sh 가 아직 없다 (T2) — 건너뛴다"; fi
      # T51 — §3 게이트에 적힌 줄인데 CI 에 없었다. check_data_sync 는 «정본과 같은 바이트인가» 이고
      #       이것은 «추출기가 제 수(펫 25 · 탈것 29 · 적 7 …)를 내는가» 다 — 둘은 다른 것을 본다.
      - name: 추출기 자기 검사 (T2 `export_data.js --self-test`)
        run: node tools/export_data.js --self-test
      - name: 아이콘 아틀라스 동기화 검사 (T31 · 러너의 google-chrome 으로 정본을 다시 그려 대조)
        run: tools/check_icons_sync.sh .wwwww-src
      - name: 키라인 자 자기 검사 (T109 `check_keyline.py` · 고장 주입 11칸)
        run: python3 tools/check_keyline.py --self-test
      - name: 정본 키라인 규칙 ↔ 클론 키라인 호출 — 막는다 (T109 · 정본이 주는데 클론이 안 부르는 자리 · KNOWN 은 T109 ⓑ 가 지운다)
        run: python3 tools/check_keyline.py --css .wwwww-src/web/css/style.css
      # T159 — 키라인 자는 «테» 만 본다. 모양(clip-path)을 보는 자가 없어 리본 꼬리의 V 홈·페넌트 꼭짓점이 조용히 민무늬 사각형이 돼 있었다.
      - name: 도형 자 자기 검사 (T159 `check_clip_paths.py` · 고장 주입 13칸)
        run: python3 tools/check_clip_paths.py --self-test
      - name: 정본 clip-path 도형 ↔ 클론이 그 자리를 굽는가 — 막는다 (T159 · KNOWN 은 T159 ⓑ 가 지운다)
        run: python3 tools/check_clip_paths.py --css .wwwww-src/web/css/style.css
      # T171 곁다리(§0-6 · T175 ⓒ 가 «다음 회차» 로 남긴 자리 · ci.yml 이 T182 lock 이라 못 넣었던 것): MonoBehaviour 가 유니티 «메시지»
      #      이름(Start·Update…)을 다른 뜻으로 쓰면 에디터가 인스턴스마다 에러를 찍고 런 403 처럼 PlayMode 가 통째로 죽는다.
      - name: 유니티 메시지 이름 자 자기 검사 (T171 `check_unity_messages.py` · 7칸)
        run: python3 tools/check_unity_messages.py --self-test
      - name: MonoBehaviour 가 유니티 메시지 이름을 다른 뜻으로 쓰는가 — 막는다 (T171)
        run: python3 tools/check_unity_messages.py
      # T178 — 정본은 거의 모든 면에 겹(linear/radial-gradient)을 깐다(선언 176). 클론의 공용 표면은 색 한 칸이라 그 겹이 조용히 사라진다.
      - name: 표면 겹 자 자기 검사 (T178 `check_surface_gradients.py` · 고장 주입)
        run: python3 tools/check_surface_gradients.py --self-test
      - name: 정본 표면 겹 ↔ 클론이 그 자리를 굽는가 — 막는다 (T178 · 표에 없는 선택자는 «미정» 으로 세기만 한다)
        run: python3 tools/check_surface_gradients.py --css .wwwww-src/web/css/style.css
      # T168 — 자간은 PNG 에서 «글자가 좀 붙었네» 로만 보여 채점에 안 걸린다. 정본이 .55em 으로 벌려 놓은 줄이 클론에선 0 이었다.
      - name: 자간 자 자기 검사 (T168 `check_letter_spacing.py` · 고장 주입 14칸)
        run: python3 tools/check_letter_spacing.py --self-test
      - name: 정본 letter-spacing ↔ 클론 자간 + 박힌 숫자 — 막는다 (T168 · KNOWN 은 T168 ⓑ 가 지운다)
        run: python3 tools/check_letter_spacing.py --css .wwwww-src/web/css/style.css
      # T333 — 정본 text-shadow 54 중 키라인 자(T109) 밖 40 이 클론에 0 이었다(TMP Underlay 사용 0). 자는 1회차(런 457)부터 있었는데
      #        ci.yml 이 T182 lock 이라 CI 에 못 실렸고 여섯 회차 동안 사람이 손으로 돌렸다 — 7회차가 gate.sh·CI 에 같이 등록.
      - name: 글자 그림자 자 자기 검사 (T333 `check_text_shadows.py` · 고장 주입 24칸)
        run: python3 tools/check_text_shadows.py --self-test
      - name: 정본 text-shadow ↔ 클론 글자 그림자 — 막는다 (T333 · 키라인 표의 10 은 T109 몫 · 표에 없는 선택자는 «미정» 으로 세기만 한다)
        run: python3 tools/check_text_shadows.py --css .wwwww-src/web/css/style.css
      # T391 — 정본 1.22~1.5rem(≈44~55px) «하한 위·제목 아래» 글자 35 선택자 ↔ 클론 글자 종류 px. 종류표에 그 단이 없어 넷이 ±27~30% 벌어져 있었다(ⓐ Head 48 · ⓑ 자리마다 종류 한 단어).
      - name: 글자 종류 자 자기 검사 (T391 `check_text_kinds.py` · 고장 주입 20칸)
        run: python3 tools/check_text_kinds.py --self-test
      - name: 정본 하한 위 글자 ↔ 클론 글자 종류 — 막는다 (T391 · 글리프 자리는 SKIP · 임자 있는 빈자리는 KNOWN)
        run: python3 tools/check_text_kinds.py --css .wwwww-src/web/css/style.css
      # T345 — 정본 border-radius 223 선언 ↔ 클론 둥근 모서리. 표값 자리는 0건이었는데 리터럴 자리 10곳이 어긋나 있었다(값이 코드에 박혀 자가 없었다).
      #        자는 1회차부터 있었고 ⓓ 배선만 «ci.yml 이 남의 lock» 으로 다섯 회차 미뤄졌다 — 6회차가 gate.sh·CI 에 같이 등록.
      - name: 둥근 모서리 자 자기 검사 (T345 `check_border_radius.py` · 고장 주입 24칸)
        run: python3 tools/check_border_radius.py --self-test
      - name: 정본 border-radius ↔ 클론 둥근 모서리 표값 — 막는다 (T345 · 50% 는 Circle · 알약 동치 결정 543 · 표에 없는 선택자는 «미정» 으로 세기만 한다)
        run: python3 tools/check_border_radius.py --css .wwwww-src/web/css/style.css
      # T377 — 정본 style.css 8692 가 «전역 --pp-red 는 안 건드린다 · 버튼 규칙에만 리터럴» 이라고 까닭까지 적어 둔 자리.
      #        토큰으로 뭉개면 화면마다 다른 빨강이 한 색이 된다(정본이 제 손으로 한 번 고친 실수를 이식이 다시 밟았다).
      - name: 못박은 면·잉크 색 자 자기 검사 (T377 `check_pinned_colors.py` · 39칸)
        run: python3 tools/check_pinned_colors.py --self-test
      - name: 정본이 선택자에만 못박은 면 색 ↔ 클론 — 막는다 (T377 · 전역 토큰은 안 건드린다 · 표에 없는 선택자는 «미정» 으로 세기만 한다)
        run: python3 tools/check_pinned_colors.py --css .wwwww-src/web/css/style.css
      # T365 — 정본 상자 테(border) 186 자리(선택자×변)의 폭 단(--ol1~--ol4)을 클론 키(line_px·line2_px·line3_px·line4_px)와 대조한다.
      #        클론은 테를 «바깥 고리 + 안쪽 면 r − 폭» 두 장으로 그리므로 Rounded 는 짝일 때만 테로 센다. 정본 ol2 자리 44 중
      #        클론이 ol1/ol3 로 어긋났던 아홉을 4~6회차가 고쳤고, 남은 일곱은 KNOWN(T331·T332 lock 뒤)에 자리·정본 줄·바꿀 키가 있다.
      - name: 상자 테 자 자기 검사 (T365 `check_box_borders.py` · 고장 주입 20칸)
        run: python3 tools/check_box_borders.py --self-test
      - name: 정본 상자 테 186 ↔ 클론 폭 단 — 막는다 (T365 · 임자 있는 빈자리는 KNOWN · 표에 없는 선택자는 «미정» 으로 세기만 한다)
        run: python3 tools/check_box_borders.py --css .wwwww-src/web/css/style.css
      # T331 — 정본 box-shadow 168 중 **바깥 그림자 61**(카드 아래턱·패널 위턱·상단바 그늘…)이 클론에 0 이다.
      #        안쪽 띠(inset)는 이미 `PopupKit.BottomShade` 로 서 있다 — 이 자는 **바깥** 갈래만 본다.
      - name: 그림자 자 자기 검사 (T331 `check_box_shadows.py` · 고장 주입 포함 28칸)
        run: python3 tools/check_box_shadows.py --self-test
      - name: 정본 바깥 그림자가 클론에 서 있는가 — 막는다 (T331 · 아직 안 선 자리는 KNOWN 에 까닭과 다음 회차를 적는다)
        run: python3 tools/check_box_shadows.py
      # T349 — 촬영·픽셀 카메라가 UI 층만 그리는데 URP 후처리(톤맵 T1 · 노출 T9 · 색 보정 T341)를 켜 두면
      #        얻는 것은 0이고 **재는 값만 밀린다**(런 562 실측: 순백 255 → 215). 3D 를 그리는 카메라는 켜는 것이 맞다 — 안 센다.
      #        6회차가 `ShotCam.From` 갈래(55장을 찍는 UiShotsTests 의 카메라)와 «남의 이름으로 끈 줄» 구멍 둘을 막았다.
      - name: 촬영 카메라 자 자기 검사 (T349 `check_shot_cams.py` · 고장 주입 18칸)
        run: python3 tools/check_shot_cams.py --self-test
      - name: UI 층만 그리는 카메라에 후처리가 켜져 있나 — 막는다 (T349)
        run: python3 tools/check_shot_cams.py
      # T361 — 줄바꿈의 기본값이 정본과 반대다(정본은 «접는다 + nowrap 40 예외», 클론 글자 공장은 «안 접는다»).
      #        1회차가 표(WrapUi.json 41)와 자를 세웠고 배선(ⓐ)은 UiKit.cs 의 산 lock 뒤다 — 자는 그 전에도 표가
      #        정본과 어긋나지 않게 지킨다(어긋남 0 · 그 절 임자가 아니라 지나가던 T349 임자가 등록 · 결정 599).
      - name: 줄바꿈 자 자기 검사 (T361 `check_wrap.py` · 고장 주입 11칸)
        run: python3 tools/check_wrap.py --self-test
      - name: 정본 white-space 41 ↔ 표 — 막는다 (T361)
        run: python3 tools/check_wrap.py --css .wwwww-src/web/css/style.css
      # T383 — 정본 ui.js 가 `<br>` 로 못박은 두·세 줄 22 자리 ↔ 클론 코드가 그 줄 수를 아는가(\n 한 상자 · 상자 여럿 split · 가변). 자는 3회차부터 있었고
      #        등록만 «gate.sh·ci.yml 이 T331 lock» 으로 여섯 회차 미뤄졌다 — 9회차가 gate.sh·CI 에 같이 등록(결정 599 · T333 7회차와 같은 길).
      - name: br 줄 수 자 자기 검사 (T383 `check_br_lines.py` · 고장 주입 10칸)
        run: python3 tools/check_br_lines.py --self-test
      - name: 정본 <br> 22 자리 ↔ 클론 줄 수 — 막는다 (T383 · 화면 줄 수는 PlayMode BrLinesTests 몫)
        run: python3 tools/check_br_lines.py --ui .wwwww-src/web/js/ui.js
      # T371 — 정본이 «등급색을 정해진 비율로 섞어» 만드는 면·테·그림자(color-mix 23) ↔ 표 ColorMixUi.json ↔ 자리 배선. 자는 3회차부터 있었고
      #        등록만 «gate.sh·ci.yml 이 T331 범위» 로 여섯 회차 미뤄졌다 — 9회차가 gate.sh·CI 에 같이 등록(결정 599 · T383 9회차와 같은 길).
      - name: 색 섞기 자 자기 검사 (T371 `check_color_mix.py` · 고장 주입 21칸)
        run: python3 tools/check_color_mix.py --self-test
      - name: 정본 color-mix 23 ↔ 표 ↔ 자리 — 막는다 (T371 · 임자 있는 빈자리는 KNOWN)
        run: python3 tools/check_color_mix.py --css .wwwww-src/web/css/style.css

      # T343 — `using` 한 네임스페이스를 그 asmdef 가 참조하는가. dotnet 하니스(T48)는 Assets 를 한 덩어리로
      #        컴파일해 **asmdef 경계가 없다** — 런 490·492 가 두 모드를 통째로 잃은 갈래를 구조적으로 못 잡는다.
      - name: asmdef 자 자기 검사 (T343 `check_asmdef_refs.py` · 고장 주입 포함 20칸)
        run: python3 tools/check_asmdef_refs.py --self-test
      - name: using ↔ asmdef 참조가 맞는가 — 막는다 (T343 · 표에 없는 네임스페이스는 알리기만)
        run: python3 tools/check_asmdef_refs.py

      # T174 — 하니스는 URP·TMP 를 스텁으로 문다(T48). 스텁이 실물에 없는 서명을 가지면 **로컬은 초록인데
      #        유니티가 «Scripts have compiler errors» 로 죽고 결과 XML 이 0개가 된다**(§1 · 런 409·410·412).
      #        진실은 유니티 안에서만 읽히므로 PlayMode `StubSigsTests` 가 진짜 표면을 screens 로 찍고
      #        이 자가 그것을 받아 오프라인으로 견준다.
      - name: 스텁 자 자기 검사 (T174 `check_stub_sigs.py` · 가짜 오버로드 주입 포함 25칸)
        run: python3 tools/check_stub_sigs.py --self-test
      - name: 스텁 목록이 스텁과 같은가 (T174 · --emit 은 손으로 고치지 않는다)
        run: |
          python3 tools/check_stub_sigs.py --emit
          git diff --exit-code -- tools/stub-sigs.want.txt || {
            echo "::error::tools/stub-sigs.want.txt 가 스텁과 어긋난다 — python3 tools/check_stub_sigs.py --emit 을 돌려 같이 커밋해라(T174)"; exit 1; }
      - name: 스텁이 실물에 없는 서명을 갖고 있나 — 막는다 (T174 · 진짜 표면은 screens 의 stub-sigs.txt)
        run: python3 tools/check_stub_sigs.py

      # T119 — 소리는 PNG 에도 테스트에도 안 드러난다. 레시피(24종)만 굽고 «부르는 곳» 이 없으면 조용히 사라진다.
      - name: 소리 자 자기 검사 (T119 `check_sfx_calls.py` · 고장 주입 포함)
        run: python3 tools/check_sfx_calls.py --self-test
      - name: 원작 소리 24종이 실제로 울리는가 — 막는다 (T119 · 호출 0 인 이름은 KNOWN 에 임자와 함께 적는다)
        run: python3 tools/check_sfx_calls.py

  gate:
    name: 유니티 시크릿 확인
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_license: ${{ steps.check.outputs.has }}
      has_code: ${{ steps.code.outputs.has }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      # 이 push 가 «유니티가 읽는 나무»(Assets/ · Packages/ · ProjectSettings/)를 건드렸는가. 문서만 바뀐 push 는 유니티 잡을 건너뛴다.
      # 판정은 fail-safe — «전부 문서» 라고 증명될 때만 false.
      - id: code
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          EV: ${{ github.event_name }}
        run: |
          has=true
          if [ "$EV" = "push" ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -q '^0*$' && git cat-file -e "$BEFORE" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE" "$SHA" || true)
            if [ -n "$files" ] && ! echo "$files" | grep -Eq '^(Assets/|Packages/|ProjectSettings/)'; then has=false; fi
          fi
          echo "has=$has" >> "$GITHUB_OUTPUT"
          echo "::notice::unity-test $( [ $has = true ] && echo 돈다 || echo '건너뛴다 — 유니티가 읽는 나무가 안 바뀌었다')"
      - id: check
        env:
          EM: ${{ secrets.UNITY_EMAIL }}
          PW: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$EM" ] && [ -n "$PW" ]; then echo "has=true" >> "$GITHUB_OUTPUT";
          else echo "has=false" >> "$GITHUB_OUTPUT"; echo "::notice::UNITY_EMAIL/UNITY_PASSWORD 시크릿이 없어 유니티 단계를 건너뛴다 (README «주인이 할 일»)"; fi

  unity-test:
    name: Unity EditMode·PlayMode 테스트
    needs: [dotnet, gate]
    if: needs.gate.outputs.has_license == 'true' && needs.gate.outputs.has_code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # T32 — 이 잡만 ref 별 직렬(계정 라이선스 활성화가 겹치지 않게). 빠른 잡은 이 그룹 밖이라 취소돼도 dotnet 검사는 이미 끝나 있다.
    concurrency:
      group: unity-test-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-test-
            Library-
      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          # UNITY_LICENSE(.ulf) 를 일부러 안 준다 — 주면 game-ci 가 file 방식을 골라 «TimeStamp validation failed» 로 죽는다(aaawunity T283).
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # T80 — 러너는 `cliVersion: latest` 를 GitHub Releases API(`game-ci/cli/releases/latest`)로 푸는데, 호스티드 러너는 IP 를 공유해
          #       무인증 한도(60/h)가 남의 잡에 먹혀 «GitHub API returned 403» 으로 테스트 0개인 채 죽는다(런 131 · 1초 만에). 러너 소스(dist/index.js
          #       resolveLatestTag)가 읽는 이름은 GITHUB_TOKEN 또는 GH_TOKEN — 공개 릴리스 읽기라 기본 토큰이면 되고 한도가 5000/h 가 된다.
          #       입력 `githubToken: ''`(체크 런 안 만들기 · 아래)과는 다른 자리다 — GH_TOKEN 을 골라 컨테이너 안 도구가 GITHUB_TOKEN 을 집어 가지 않게 한다.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          testMode: all
          artifactsPath: unity-test-results
          # T392 — 커버리지 계측을 끈다. 러너의 `coverageEnabled` 기본값이 true 라 `-enableCodeCoverage`·`-coverageOptions`·
          #        `-coverageResultsPath` 셋이 우리가 안 적어도 붙고, 런 730 은 **어셈블리 리로드 한가운데** 그 계측
          #        (`ScriptingCoverage::FilterRecordedMethods` → `InitializeCoreScriptingClasses` → `RequireType` 실패 →
          #        그 실패를 찍으며 `ExtractStackTrace`)에서 SIGSEGV 로 죽어 PlayMode 가 통째로 안 돌았다(런 403·425 와 같은 자리 ·
          #        T171·T180). 러너 제 설명이 «Some Unity versions/configurations fail or crash with this on» 이라고 적어 뒀다.
          #        잃는 것은 없다 — `com.unity.testtools.codecoverage` 는 manifest 에 없고 CodeCoverage/ 산출물을 읽는 스텝도 없다.
          # ⚑ T392 §0-6 급 수리(2026-09-15 18:2x · 워커 E · 결정 666 · lock 은 임자 것) — **그 입력을 도로 걷었다.**
          #    런 739 잡 로그가 이유를 한 줄로 말한다(컨테이너에서 못 여는 자리라 GitHub API 로 읽었다 · T344):
          #      /tmp/game-ci-cli-cache/v0.1.65/game-ci test … **--no-coverageEnabled** --coverageOptions=…
          #      [WARN] Unknown argument: noCoverageEnabled
          #      ##[error]Test run failed with exit code 1      ← 18ms 뒤 · 도커도 에디터도 안 뜬다
          #    러너는 boolean false 를 `--no-<이름>` 으로 CLI 에 넘기는데 `game-ci` CLI v0.1.65(= 지금 latest)가
          #    그 꼴을 모른다. 그래서 잡이 **시작조차 못 하고** 죽어 EditMode·PlayMode 가 **둘 다** 0개가 됐다
          #    (런 730 의 SIGSEGV 는 PlayMode 하나만 죽였다 — 고치려던 것보다 나빠졌다). 이 상태는 플레이크가 아니라
          #    **모든 런에 되풀이된다** — 이 레포의 유니티 검증이 통째로 멎는다.
          #    ⇒ 되돌린 자리는 이 한 줄뿐이고 T392 의 진단(위 주석)은 그대로 둔다. 커버리지를 끄는 길은 러너 입력이
          #      아니라 **T180 이 남긴 나머지 칸**(`ProjectSettings` 의 `m_StackTraceTypes` 에서 Error·Exception 을 None 으로)이다 —
          #      SIGSEGV 는 계측 실패 자체가 아니라 **그 실패를 찍으며 Mono 스택을 걷는 자리**에서 났다(T392 가 읽은 스택 그대로).
          #      러너 입력으로 다시 끄려면 `cliVersion` 이 `--no-` 꼴을 아는 판으로 올라간 뒤다(v0.1.65 는 모른다).
          # 빈 값으로 «명시» 해야 체크 런을 안 만든다(안 적으면 러너가 제 토큰을 채워 checks:write 없이 죽는다 · aaawunity T295).
          githubToken: ''
      # 잡 로그는 MCP/웹에서 **꼬리 5000줄**만 보인다 — PlayMode XML 앞부분(B~S 픽스처)이 잘려 «어느 테스트가 빨간가» 를 못 읽고, 아티팩트 zip 은
      # 컨테이너 프록시가 막는다(T8 실측 2026-09-12 · 런 35·38). 끝에 총계·픽스처별 결과·실패 테스트 이름을 한 번 더 짧게 찍는다.
      - name: 테스트 결과 요약 (test-run 총계 · 픽스처 · 실패 테스트 이름 · 실패 메시지 첫 6줄 · 모드 XML 부재)
        id: summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, re
          files = sorted(glob.glob('unity-test-results/**/*.xml', recursive=True))
          if not files: print('::warning::unity-test-results/*.xml 이 없다 — 러너가 테스트를 못 돌렸다')
          # T67 — 한쪽 모드만 죽으면 아무도 못 봤다(런 94: EditMode 505 초록 · playmode-results.xml 없음 · PNG 0장).
          # «테스트 0개는 빨간 테스트보다 나쁘다»(ROUTINE §1) — 모드마다 결과 XML 이 있는지 이름으로 말한다.
          have = set(os.path.basename(f) for f in files)
          missing = [m for m in ('editmode-results.xml', 'playmode-results.xml') if m not in have]
          for m in missing:
              print('::error::' + m + ' 이 없다 — 그 모드는 이 런에서 **한 개도** 안 돌았다(테스트 0개). '
                    '코드 빨강이 아니라 러너가 죽은 것일 수 있다: 잡 로그에서 '
                    '«Failed to return the Personal license seat» · «no available seats» · «Unable to activate license» 를 먼저 찾아라 '
                    '(ROUTINE §1 «라이선스 좌석» 갈래 — 그때는 재실행 1회 · 계속되면 주인에게 보고 · lock 은 쥔 채).')
          # T81 — 잡 결과를 «판정» 스텝이 명시적으로 내도록 실패 수와 «총계를 못 읽은 XML» 을 출력으로 남긴다.
          totals = {}
          for f in files:
              s0 = open(f, encoding='utf-8', errors='replace').read()
              m0 = re.search(r'<test-run [^>]*?total="(\d+)" passed="(\d+)" failed="(\d+)"', s0)
              totals[f] = m0.groups() if m0 else None
          failed_total = sum(int(g[2]) for g in totals.values() if g)
          unknown = [os.path.basename(f) for f, g in totals.items() if not g]
          gh = os.environ.get('GITHUB_OUTPUT')
          if gh:
              with open(gh, 'a', encoding='utf-8') as fh:
                  fh.write('missing=' + ','.join(missing) + '\n')
                  fh.write('failed=' + str(failed_total) + '\n')
                  fh.write('unknown=' + ','.join(unknown) + '\n')
          # T67 — playmode-red.txt 는 두 모드를 이어 붙이고 «== 런 끝» 이 모드마다 하나라, 꼬리를 읽으면
          # 나중에 끝난 EditMode 줄(«초록 507 · 빨강 0»)만 보여 PlayMode 빨강이 안 보인다(런 95 실측: PlayMode 5 빨강).
          # 모드별 총계를 한 줄씩 적어 두면 screens 배포 스텝이 그 파일 머리에 박는다.
          # T386 ⓑ — «건너뜀» 칸을 총계에 더한다. 남의 산 lock 뒤라 **지금 못 고치는** 자리를 재는 케이스는
          #        `Assert.Ignore("KNOWN T<번호> lock 뒤 — …")` 로 접는다(§1) — 그 수가 장부에 없으면 아무도 못 세고,
          #        «남은 일» 이 숨거나 반대로 남의 빨강이 회차마다 §0-6 의 첫 일로 잘못 선다.
          def _attr(x, k):
              m2 = re.search(r'<test-run\b[^>]*?\b' + k + r'="(\d+)"', x)
              return m2.group(1) if m2 else '?'

          def _skipped_cases(x):
              """건너뛴 케이스 [(이름, 사유 한 줄)] — 속성 차례에 안 매이게 하나씩 읽는다."""
              hits = []
              for mc in re.finditer(r'<test-case\b([^>]*?)(/>|>(.*?)</test-case>)', x, re.S):
                  at, body = mc.group(1), (mc.group(3) or '')
                  rs = re.search(r'\bresult="([^"]*)"', at)
                  if not rs or rs.group(1) not in ('Skipped', 'Inconclusive'):
                      continue
                  nm = re.search(r'\bfullname="([^"]*)"', at) or re.search(r'\bname="([^"]*)"', at)
                  msg = re.search(r'<message>\s*(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?\s*</message>', body, re.S)
                  why = ' '.join((msg.group(1) if msg else '').split())
                  hits.append(((nm.group(1) if nm else '?'), why))
              return hits

          with open('modes-summary.txt', 'w', encoding='utf-8') as fh:
              for f in files:
                  s2 = open(f, encoding='utf-8', errors='replace').read()
                  mm = re.search(r'<test-run [^>]*?total="(\d+)" passed="(\d+)" failed="(\d+)"', s2)
                  g = mm.groups() if mm else ('?', '?', '?')
                  fh.write('#   %s: 전부 %s · 초록 %s · 빨강 %s · 건너뜀 %s\n'
                           % ((os.path.basename(f),) + g + (_attr(s2, 'skipped'),)))
                  for nm, why in _skipped_cases(s2):
                      fh.write('#   건너뜀 %s :: %s\n' % (nm, why or '(사유 없음)'))
              for m in missing:
                  fh.write('# ⚠ %s 이 없다 — 그 모드는 한 개도 안 돌았다(테스트 0개 · ROUTINE §1). 잡 로그에서 «Failed to return the Personal license seat» · «no available seats» · «Unable to activate license» 를 먼저 보라(T67).\n' % m)
          for f in files:
              s = open(f, encoding='utf-8', errors='replace').read()
              m = re.search(r'<test-run [^>]*?total="(\d+)" passed="(\d+)" failed="(\d+)"', s)
              print('== %s: total %s · passed %s · failed %s' % ((os.path.basename(f),) + (m.groups() if m else ('?', '?', '?'))))
              for fx in re.findall(r'<test-suite type="TestFixture"[^>]*name="([^"]+)"[^>]*result="(\w+)"[^>]*total="(\d+)" passed="(\d+)" failed="(\d+)"', s):
                  print('   %-32s %-7s %s/%s' % (fx[0], fx[1], fx[3], fx[2]))
              # 실패 이름만으로는 원인을 못 본다(잡 로그 API 는 꼬리 5000줄만 주고 아티팩트 blob 은 클라우드 세션 프록시가 막는다 · T10 실측) — 메시지 첫 6줄을 같이 찍는다
              for name, body in re.findall(r'<test-case[^>]*fullname="([^"]+)"[^>]*result="Failed"[^>]*>(.*?)</test-case>', s, re.S):
                  print('   FAILED ' + name)
                  mm = re.search(r'<message><!\[CDATA\[(.*?)\]\]></message>', body, re.S)
                  if mm:
                      for line in mm.group(1).strip().split('\n')[:6]: print('      | ' + line[:300])
                  # 스택 첫 3줄 — NullReferenceException 처럼 메시지가 자리를 안 말하는 예외용(T19)
                  st = re.search(r'<stack-trace><!\[CDATA\[(.*?)\]\]></stack-trace>', body, re.S)
                  if st:
                      for line in st.group(1).strip().split('\n')[:3]: print('      @ ' + line[:300])
          PY
      # T81 — 러너가 죽은 런(런 131 · CLI 403)은 `steps.tests.outputs.artifactsPath` 가 비어 업로드 스텝까지 «Input required and not supplied: path» 로
      #       덤으로 빨갰다. 우리가 `artifactsPath: unity-test-results` 를 주고 있으니 그 경로를 그대로 적고, 없으면 조용히 지나간다.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results
          path: unity-test-results
          if-no-files-found: ignore
      # T151 — 모드 XML 이 없는 런의 «왜» 는 러너 안(`unity-test-results/<모드>.log` · game-ci 가 모드마다 -logFile 로 남긴다)에만 있다:
      #        잡 로그는 MCP 로 꼬리 5000줄만 오고(런 348 은 전체 6,805줄 · PlayMode 구간은 앞 1,805줄이라 못 본다) 아티팩트 zip·로그 blob 은
      #        컨테이너 프록시가 막는다(세 길 전부 403). 그래서 러너가 여기서 스스로 말한다 — 원인 문구 줄 + 꼬리를 잡 로그 **끝**(5000줄 창 안 ·
      #        다른 정보를 밀어내지 않게 상한)에 찍고, 더 긴 발췌(머리 60 + 꼬리 400)를 `screens` 의 `<모드>-log.txt` 로 보낸다. 두 모드가 다 돈 런은 조용.
      #        «좌석 반납 4번 실패» 경고는 초록 런 꼬리에도 똑같이 있어 원인이 아니다(T151 · 런 346 실측) — 원인은 초록 런과 **차이나는** 줄에서 찾는다.
      - name: 실종 모드 로그 발췌 (모드 XML 이 없는 모드의 에디터 로그 → 잡 로그 끝 + screens · T151)
        if: always()
        env:
          MISSING: ${{ steps.summary.outputs.missing }}
        run: |
          [ -n "$MISSING" ] || { echo "모드 XML 둘 다 있다 — 발췌 없음(T151)"; exit 0; }
          sudo chown -R "$(id -u):$(id -g)" ui-screens unity-test-results 2>/dev/null || true
          mkdir -p ui-screens
          pat='error|Exception|crash|Abort|Fatal|Killed|signal|license|seat|compiler errors|Shader error'
          for x in ${MISSING//,/ }; do
            mode="${x%-results.xml}"
            log="unity-test-results/$mode.log"
            out="ui-screens/$mode-log.txt"
            {
              printf '# T151 — 런 #%s (%s) · %s 의 결과 XML 이 없다 · 에디터 로그 %s\n' "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$mode" "$log"
              if [ ! -s "$log" ]; then
                printf '# 로그 파일도 없다(또는 0바이트) — 러너가 이 모드의 에디터를 띄우지도 않았다. unity-test-results/ 에 있는 것: %s\n' "$(ls unity-test-results 2>/dev/null | tr '\n' ' ')"
              else
                printf '# 줄 수 %s · 마지막 수정 %s\n' "$(wc -l < "$log")" "$(date -u -r "$log" +%FT%TZ)"
                printf '## 원인 문구 줄(최대 60 · %s)\n' "$pat"
                grep -nE "$pat" "$log" | head -n 60
                printf '## 머리 60줄\n'; head -n 60 "$log"
                printf '## 꼬리 400줄\n'; tail -n 400 "$log"
              fi
            } > "$out"
            echo "::error::T151 — $mode 결과 XML 이 없다 · 에디터 로그 발췌를 screens 의 $mode-log.txt 로 올린다(아래 그룹은 원인 문구 줄 ≤60 + 꼬리 120줄)"
            echo "::group::T151 $mode 로그 발췌 ($log)"
            if [ -s "$log" ]; then grep -nE "$pat" "$log" | head -n 60; echo '-- 꼬리 120줄 --'; tail -n 120 "$log"; else echo "(로그 파일 없음 — unity-test-results/: $(ls unity-test-results 2>/dev/null | tr '\n' ' '))"; fi
            echo "::endgroup::"
          done
      # T81 — 잡 결과는 러너 스텝이 통째로 쥐고 있었다: 러너가 XML 을 남기고 초록으로 끝났는데 한 모드가 통째로 빠진 런(런 94)이 초록이었고,
      #       러너가 죽은 런은 «왜» 가 로그 속에만 있었다. 요약 스텝의 출력으로 잡 결과를 한 번 더 명시적으로 낸다 — 신호는 겹으로 · 초록 오판 0.
      #       (러너 스텝은 그대로 둔다. 요약 스텝이 죽어 출력이 비면 판정도 빨강이다 — 닫힌 쪽으로 실패한다.)
      - name: 결과 판정 (모드 XML 둘 다 있고 · 실패 테스트 0 이어야 초록 · T81)
        if: always()
        env:
          MISSING: ${{ steps.summary.outputs.missing }}
          FAILED: ${{ steps.summary.outputs.failed }}
          UNKNOWN: ${{ steps.summary.outputs.unknown }}
        run: |
          if [ -n "$MISSING" ]; then echo "::error::테스트 0개인 모드가 있다 — $MISSING (러너가 죽었거나 그 모드가 안 돌았다 · ROUTINE §1 «테스트 0개는 빨간 테스트보다 나쁘다»)"; exit 1; fi
          if [ -n "$UNKNOWN" ]; then echo "::error::결과 XML 의 총계를 못 읽었다 — $UNKNOWN"; exit 1; fi
          if [ "${FAILED:-?}" != "0" ]; then echo "::error::실패 테스트 ${FAILED:-?}개 — 위 «테스트 결과 요약» 의 FAILED 줄을 보라"; exit 1; fi
          echo "::notice::판정 — 모드 XML 둘 다 있고 실패 0 · 유니티 잡 초록"
      # T27 — PlayMode 촬영 테스트가 남기는 PNG 를 «screens» 브랜치로(main push · 빨간 런이어도).
      # T51 — 올릴 조건이 «PNG 개수» 였다: 촬영 픽스처까지 죽은 런에서는 T46 의 playmode-red.txt 가 안 올라가
      #       «왜 죽었나» 를 읽을 길이 정확히 그때 사라졌다. 이제 meta.json 말고 무엇이든 있으면 올린다.
      #       배포가 force_orphan(브랜치를 통째로 갈아치움)이라 PNG 0장인 런이 지난 그림을 지워 버리므로,
      #       0장이면 지난 screens 의 PNG 를 먼저 받아 담는다 — 로그를 얻자고 그림을 잃지 않는다.
      - name: screens 브랜치용 meta.json
        id: shots
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" ui-screens 2>/dev/null || true
          mkdir -p ui-screens
          # T67 — 모드 XML 이 없는 런의 playmode-red.txt 는 «돈 모드» 것뿐이라 꼬리(«런 끝: 초록 N · 빨강 0»)만 보면
          #       다음 회차 워커가 «내 커밋이 든 런은 돌았다» 로 읽는다. 머리에 한 줄을 박아 screens 로도 보이게 한다.
          miss="${{ steps.summary.outputs.missing }}"
          if [ -s modes-summary.txt ]; then
            { printf '# ── 이 런 #%s (%s) 모드별 총계 — 아래 본문은 EditMode·PlayMode 가 이어 붙은 것이라\n' "$GITHUB_RUN_NUMBER" "$GITHUB_SHA"
              printf '#    «== 런 끝» 줄이 모드마다 하나다. 꼬리만 읽지 마라(T67).\n'
              cat modes-summary.txt
              cat ui-screens/playmode-red.txt 2>/dev/null || true
            } > ui-screens/.red.tmp && mv ui-screens/.red.tmp ui-screens/playmode-red.txt
          fi
          n=$(ls ui-screens/*.png 2>/dev/null | wc -l)
          carried=0
          # T170 — 이어받기는 **PNG 만이 아니다.** 이 잡이 그림을 한 장도 못 냈다는 것은 곧 «PlayMode 가 안 돌았다» 는 뜻이고,
          #        그때 지난 런의 **글자 자국**(`t121-ramp.txt`·`t147-feature.txt`·`t167-itemfaces.txt`·`perf-*.txt`·`playthrough.txt` …)까지
          #        같이 날아갔다(런 403 실측: 에디터가 play mode 어셈블리 재적재에서 SIGSEGV → shots 0 · 글자 자국 전멸).
          #        그 파일들은 «초록인 런의 잡 로그에는 안 실리니 글자로 남긴다» 는 바로 그 목적으로 만들어진 것이라
          #        **가장 필요한 순간에 사라지던 셈**이다. 이 런이 스스로 쓴 파일은 덮지 않는다(있으면 건너뛴다).
          # T347 — 바깥 조건 `[ "$n" = "0" ]` 을 **걷었다**. 그것 때문에 «몇 장이라도 낸 런»(부분 실패)이 나머지를
          #        통째로 지웠다(런 494 실물 `shots: 17 · carried: 0` ↔ 직전 런 463 은 63장 · 46장 + 글자 자국 소실).
          #        고르기는 `tools/screens_carry.py` 가 쥔다(자기 검사 15칸) — «이 런이 쓴 것은 안 덮는다» 는 그대로이고,
          #        이어받은 것은 `carried.txt` 에 «어느 런 것인가» 로 적어 눈 확인(§1)이 지난 그림을 이번 것으로 읽지 않게 한다.
          carry="$GITHUB_WORKSPACE/tools/screens_carry.py"
          python3 "$carry" --self-test || { echo "::error::screens 이어받기 자(tools/screens_carry.py) 자기 검사 실패 — 이어받기를 멈춘다(T347)"; exit 1; }
          cand=0
          if git fetch --depth 1 origin screens 2>/dev/null; then
            git show FETCH_HEAD:meta.json > prev-meta.json 2>/dev/null || : > prev-meta.json
            for f in $(git ls-tree --name-only FETCH_HEAD | python3 "$carry" plan --dir ui-screens --names - --from-meta prev-meta.json --run "$GITHUB_RUN_NUMBER" --stats-out carry-stats.txt); do
              git show "FETCH_HEAD:$f" > "ui-screens/$f" && carried=$((carried+1)) || true
            done
            cand=$(sed -n 's/^candidates=//p' carry-stats.txt 2>/dev/null || true)
            rm -f prev-meta.json carry-stats.txt
          fi
          # T347 2회차 — `carried: 0` 한 수로는 «받을 것이 없었다»(정상)와 «지난 screens 를 아예 못 받았다»(이어받기가 죽음)가
          #        똑같아 보인다(런 535 실물 `shots 69 · carried 0`). 지난 screens 가 내놓은 **후보 수**를 같이 적어 둘을 가른다.
          case "$cand" in ''|*[!0-9]*) cand=0 ;; esac   # meta.json 은 JSON 이다 — 숫자가 아니면 0
          any=$(ls -A ui-screens 2>/dev/null | grep -cv '^meta[.]json$' || true)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "any=$any" >> "$GITHUB_OUTPUT"
          printf '{"sha":"%s","run":%s,"tests":"%s","shots":%s,"carried":%s,"carry_candidates":%s,"missing_modes":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "${{ steps.tests.outcome }}" "$n" "$carried" "$cand" "$miss" > ui-screens/meta.json
          # T148 — 런 **장부** `runs.jsonl`: 유니티 잡이 돈 런마다 한 줄을 **덧붙인다**(지난 screens 의 장부를 받아 이어 쓴다 · 꼬리 400줄).
          #        screens 는 고아 커밋 하나를 force push 하므로 meta.json 에는 이력이 없다 — `check_unity_green` 이 «직전 초록 런의 sha» 를
          #        여기서 읽어 «그 뒤 이 런에 새로 들어온 코드 커밋» 으로 남의 자 여럿을 깨뜨린 임자를 가린다. 못 받으면 이 런 한 줄로 새로 시작한다.
          : > ui-screens/.runs.tmp
          if git fetch --depth 1 origin screens 2>/dev/null; then git show FETCH_HEAD:runs.jsonl > ui-screens/.runs.tmp 2>/dev/null || : > ui-screens/.runs.tmp; fi
          printf '{"sha":"%s","run":%s,"tests":"%s","missing_modes":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "${{ steps.tests.outcome }}" "$miss" >> ui-screens/.runs.tmp
          tail -n 400 ui-screens/.runs.tmp > ui-screens/runs.jsonl && rm -f ui-screens/.runs.tmp
          echo "::notice::screens — 이 런의 PNG ${n}장 · 이어받은 파일 ${carried}개/후보 ${cand}개(무엇인지는 screens 의 carried.txt · T347) · 올릴 파일 ${any}개 · 없는 모드 XML «${miss:-없음}»"
      # T96 — 런 164·168: peaceiris/actions-gh-pages 의 `git push --force screens` 가 «remote: Internal Server Error» 로 거절됐다
      #       (GitHub 쪽 500 · 22분 간격 두 번 · 같은 시각 런 167 은 startup_failure). 액션은 한 번 밀고 죽어 그 문구가 잡 로그 깊숙이만 남고
      #       screens(눈 확인 §5 · T46 진단)가 멈춘다. 같은 일(고아 루트 커밋 하나 · force push)을 셸로 하고 ⓐ 15·30·45·60초 뒤 네 번 더 민다
      #       ⓑ 실패 문구를 ::warning/::error 주석으로 잡 요약에 찍는다(토큰은 가린다) — 끝내 못 밀면 잡은 그대로 빨강이다.
      # T336 — 런 463: 겹쳐 돈 유니티 런 둘 중 «늦게 끝난 쪽»(459) 이 «먼저 끝난 쪽»(463) 을 통째로 지웠다 — 배포가 고아 커밋
      #        하나를 `--force` 로 밀어 그 사이 남이 민 장부·그림을 못 본다. 그래서 밀기 **직전마다** screens 를 다시 받아
      #        ⓐ runs.jsonl 은 두 장부의 합집합(run 오름차순 · 꼬리 400 · tools/screens_ledger.py)으로 ⓑ 받은 meta.json 의 run 이
      #        내 런보다 **크면** 그쪽 그림·meta·글자 자국을 두고 장부만 보탠다 ⓒ `--force-with-lease` 로 «내가 본 sha» 위에만 민다 —
      #        그 사이 또 누가 밀었으면 거절되니 다음 시도에서 다시 받아 합친다(다섯 번). 장부 자는 밀기 전에 자기 검사를 한다.
      - name: screens 브랜치 배포
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.shots.outputs.any != '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          ledger="$GITHUB_WORKSPACE/tools/screens_ledger.py"
          python3 "$ledger" --self-test || { echo "::error::screens 장부 자(tools/screens_ledger.py) 자기 검사 실패 — 배포를 멈춘다(T336)"; exit 1; }
          rm -rf /tmp/screens-deploy /tmp/screens-mine && cp -r ui-screens /tmp/screens-mine && mkdir -p /tmp/screens-deploy && cd /tmp/screens-deploy
          git init -q -b screens
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          msg=""
          for i in 1 2 3 4 5; do
            # ⓐ 지금 screens 끝 sha — 이것 위에만 민다. 없으면(브랜치가 아직 없다) 빈 기대값 = «없어야 민다».
            seen=$(git ls-remote "$url" refs/heads/screens 2>/dev/null | cut -f1 || true)
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            keep="mine"
            if [ -n "$seen" ] && git fetch -q --depth 1 "$url" screens 2>/dev/null; then
              git show FETCH_HEAD:meta.json > /tmp/screens-theirs-meta.json 2>/dev/null || : > /tmp/screens-theirs-meta.json
              git show FETCH_HEAD:runs.jsonl > /tmp/screens-theirs-runs.jsonl 2>/dev/null || : > /tmp/screens-theirs-runs.jsonl
              if python3 "$ledger" newer --theirs /tmp/screens-theirs-meta.json --mine /tmp/screens-mine/meta.json; then
                keep="theirs"; git checkout -q FETCH_HEAD -- . 2>/dev/null || true   # ⓑ 그쪽이 더 새 런 — 그쪽 그림·meta 그대로
              fi
            else
              : > /tmp/screens-theirs-runs.jsonl
            fi
            if [ "$keep" = "mine" ]; then cp -r /tmp/screens-mine/. .; fi
            python3 "$ledger" merge --theirs /tmp/screens-theirs-runs.jsonl --mine /tmp/screens-mine/runs.jsonl --out runs.jsonl
            touch .nojekyll
            git add -A
            git -c user.name="$GITHUB_ACTOR" -c user.email="$GITHUB_ACTOR@users.noreply.github.com" commit -qm "deploy: $GITHUB_SHA (run $GITHUB_RUN_NUMBER · 장부 $(wc -l < runs.jsonl)줄 · 그림은 ${keep} 쪽)" --allow-empty
            if git push --force-with-lease="refs/heads/screens:${seen}" "$url" HEAD:refs/heads/screens 2>push-err.txt; then
              echo "::notice::screens 브랜치 배포 — ${i}번째 시도에 성공(런 $GITHUB_RUN_NUMBER · $(ls *.png 2>/dev/null | wc -l)장 · 장부 $(wc -l < runs.jsonl)줄 · 그림은 ${keep} 쪽 · 본 sha ${seen:-없음})"
              exit 0
            fi
            msg=$(tr '\n' ' ' < push-err.txt | sed 's/x-access-token:[^@]*@/***@/g' | cut -c1-400)
            echo "::warning::screens 브랜치 배포 ${i}번째 실패 — $msg"
            git update-ref -d HEAD 2>/dev/null || true   # 다음 시도는 다시 고아 커밋 하나
            [ "$i" -lt 5 ] && sleep $((15*i))
          done
          echo "::error::screens 브랜치 배포 5회 실패(런 $GITHUB_RUN_NUMBER) — $msg"
          exit 1
